<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            background: linear-gradient(135deg, #f8e8ee, #e8dff5);
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;
            padding: 50px 30px;
        }

        .card {

            padding: 45px;
            border-radius: 20px;

        h1 {
            margin-bottom: 10px;
            font-size: 45px;
        }

        .subtitle {
            font-size: 22px;
            color: #777;
        }

        .about {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        .about p {
            font-size: 18px;
            line-height: 1.6;
        }

        footer {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Hi, I'm Daniela! ♡</h1>

            <div class="subtitle">
                Bachelor of Science in Information Technology
            </div>

            <div class="about">
                <p>
                    An Information Technology student passionate about web design,
                    UI design, and creating visually engaging digital experiences.
                </p>
            </div>


    </div>

</html>
